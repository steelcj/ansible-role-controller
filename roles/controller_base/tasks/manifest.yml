---
- name: Write controller manifest
  copy:
    dest: "{{ controller_project_root }}/controller_manifest.yml"
    mode: "0644"
    content: |
      kind: "ansible-controller"
      schema_version: "1.0"

      controller:
        environment: "{{ controller_env }}"
        ansible_core_version: "{{ controller_ansible_core_version }}"
        venv_path: "{{ controller_venv_root }}/{{ controller_ansible_core_version }}"
        project_root: "{{ controller_project_root }}"

      provenance:
        created: "{{ ansible_facts['date_time']['iso8601'] }}"
        host: "{{ ansible_facts['hostname'] }}"
